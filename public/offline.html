<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#bfe4fb">
<title>電波がつながりません | エンカレ夢中万博</title>
<style>
  /* 電波がないときに出すページ。外のフォントは読めないので、端末の字でドット風に */
  html, body { margin: 0; min-height: 100%; background: #bfe4fb; color: #1f2547; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif; }
  main { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; box-sizing: border-box; text-align: center; }
  .card { background: #fff; border: 3px solid #9fcdee; border-radius: 14px; box-shadow: 0 4px 0 #8fc3e8; padding: 24px 20px; max-width: 420px; }
  h1 { font-size: 1.6rem; color: #5fbe85; margin: 12px 0 8px; text-shadow: 2px 0 #276b45, -2px 0 #276b45, 0 2px #276b45, 0 -2px #276b45, 3px 3px 0 #276b45; letter-spacing: 0.04em; }
  p { line-height: 1.8; margin: 0 0 10px; }
  .date { color: #5d4fdc; font-weight: 700; }
  button { margin-top: 8px; min-height: 52px; padding: 0 24px; border-radius: 10px; border: 3px solid #276b45; background: #5fbe85; color: #10331f; font: inherit; font-weight: 900; font-size: 1.05rem; box-shadow: 0 4px 0 #276b45; cursor: pointer; }
  svg { display: block; margin: 0 auto; }
</style>
</head>
<body>
<main>
  <div class="card">
    <svg width="96" height="54" viewBox="0 0 16 9" shape-rendering="crispEdges" aria-hidden="true">
      <rect x="2" y="0" width="12" height="7" fill="#1f2547"/><rect x="3" y="1" width="10" height="5" fill="#5fbe85"/>
      <rect x="4" y="3" width="3" height="1" fill="#1f2547"/><rect x="5" y="2" width="1" height="3" fill="#1f2547"/>
      <rect x="10" y="2" width="1" height="1" fill="#1f2547"/><rect x="11" y="4" width="1" height="1" fill="#1f2547"/>
      <rect x="3" y="7" width="3" height="2" fill="#1f2547"/><rect x="10" y="7" width="3" height="2" fill="#1f2547"/>
    </svg>
    <h1>電波がつながりません</h1>
    <p>このページはまだ開いたことがないので、電波がないと見られません。電波のよい所で、もう一度ためしてください。</p>
    <p>一度開いたページ（ホーム・お店・マップなど）は、電波が弱くても前の情報で見られます。</p>
    <p class="date">エンカレ夢中万博　2026.11.28（土）10:00〜14:00</p>
    <button type="button" onclick="location.reload()">もう一度読みこむ</button>
  </div>
</main>
</body>
</html>
