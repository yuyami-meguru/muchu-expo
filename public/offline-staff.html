<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>電波がつながりません | エンカレ夢中万博 お店・実行委員</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif; background: #bfe4fb; color: #1f2547; line-height: 1.8; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 20px; }
  h1 { font-size: 1.4rem; margin: 0 0 12px; }
  .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 4px 0 #8fc3e8; }
  ol { padding-left: 1.3em; margin: 8px 0 0; }
  button { margin-top: 18px; width: 100%; min-height: 52px; font: inherit; font-weight: 900; border: 0; border-radius: 10px; background: #23784a; color: #fff; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    body { background: #0f1a33; color: #eef4ff; }
    .card { background: #182747; box-shadow: none; }
    button { background: #7fd6a2; color: #0f1a33; }
  }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>電波がつながりません</h1>
    <p>いまは売り切れなどを変えられません（押しても、お客さんには出ません）。</p>
    <ol>
      <li>電波のよい所（建物の入口・窓の近く）へ移って、下の「読み込み直す」を押してください。</li>
      <li>急いで売り切れを出したいときは、近くの実行委員に声をかけてください。</li>
    </ol>
    <button type="button" onclick="location.reload()">読み込み直す</button>
  </div>
</main>
</body>
</html>
